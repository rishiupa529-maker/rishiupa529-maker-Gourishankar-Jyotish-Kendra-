{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaurishankar Jyotishkendra</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  
  <style>
    /* Override Bootstrap styles for our theme */
    .btn {
        border-radius: 50px !important;
    }
    .form-control {
        background: var(--bg-card) !important;
        border: var(--border-gold) !important;
        color: var(--text-light) !important;
    }
    .form-control:focus {
        background: var(--bg-card) !important;
        border-color: var(--gold-primary) !important;
        color: var(--text-light) !important;
    }
  </style>
  
  <style>
    :root {
        --bg-dark: #120904;
        --bg-card: #221108;
        --bg-glass: rgba(38, 19, 9, 0.78);
        --gold-primary: #f4ce6a;
        --gold-secondary: #d4af37;
        --gold-gradient: linear-gradient(135deg, #ffe58f 0%, #d4af37 50%, #9a6818 100%);
        --saffron: #e67300;
        --maroon: #3b1906;
        --maroon-dark: #0a0402;
        --text-light: #fffdf5;
        --text-muted: #dcc4a6;
        --text-dark: #1a0c02;
        --shadow-gold: 0 0 25px rgba(212, 175, 55, 0.38);
        --border-gold: 1px solid rgba(212, 175, 55, 0.42);
        --transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Poppins', 'Mukta', sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-light);
        overflow-x: hidden;
        transition: background-color 0.4s ease, color 0.4s ease;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    a {
        text-decoration: none;
        color: inherit;
        transition: var(--transition);
    }

    .btn {
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: var(--transition);
    }

    .btn-primary {
        background: var(--gold-gradient);
        color: var(--text-dark);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-gold);
    }

    .section {
        padding: 80px 0;
    }

    .section-title {
        text-align: center;
        margin-bottom: 50px;
    }

    .section-title h2 {
        font-size: 2.5rem;
        color: var(--gold-primary);
        margin-bottom: 15px;
    }

    .card {
        background: var(--bg-card);
        border: var(--border-gold);
        border-radius: 15px;
        padding: 25px;
        transition: var(--transition);
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-gold);
    }

    /* Header Styles */
    header {
        background: var(--bg-glass);
        backdrop-filter: blur(10px);
        padding: 15px 0;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        border-bottom: var(--border-gold);
    }

    .navbar {
        max-width: 1350px;
        margin: 0 auto;
        padding: 0 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        flex-shrink: 0;
    }

    .logo-icon {
        font-size: 32px;
        color: var(--gold-primary);
        filter: drop-shadow(0 0 8px var(--gold-secondary));
    }

    .logo-text h1 {
        font-family: 'Cinzel', serif;
        font-size: 18px;
        color: var(--gold-primary);
        font-weight: 700;
        line-height: 1.2;
        margin: 0;
    }

    .logo-text span {
        font-size: 11px;
        color: var(--text-muted);
        letter-spacing: 2px;
        display: block;
        text-transform: uppercase;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 30px;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .nav-link {
        color: var(--text-light);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: var(--transition);
        position: relative;
        padding: 5px 0;
    }

    .nav-link::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--gold-gradient);
        transition: var(--transition);
    }

    .nav-link:hover {
        color: var(--gold-primary);
    }

    .nav-link:hover::after {
        width: 100%;
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .theme-toggle {
        background: transparent;
        border: 1px solid var(--gold-primary);
        color: var(--gold-primary);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
    }

    .theme-toggle:hover {
        background: var(--gold-primary);
        color: var(--maroon-dark);
        box-shadow: var(--shadow-gold);
    }

    .btn-gold {
        background: var(--gold-gradient);
        color: #1a0c02;
        font-weight: 700;
        padding: 10px 22px;
        border-radius: 30px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
        transition: var(--transition);
        white-space: nowrap;
    }

    .btn-gold:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 6px 25px rgba(212, 175, 55, 0.6);
    }

    .mobile-menu-btn {
        display: none;
        background: none;
        border: none;
        color: var(--gold-primary);
        font-size: 24px;
        cursor: pointer;
        padding: 5px;
    }

    /* Mobile Navigation */
    .mobile-nav {
        display: none;
        position: fixed;
        top: 70px;
        left: 0;
        width: 100%;
        background: var(--bg-card);
        padding: 20px;
        z-index: 999;
        border-bottom: var(--border-gold);
        flex-direction: column;
        gap: 0;
        max-height: calc(100vh - 70px);
        overflow-y: auto;
    }

    .mobile-nav.active {
        display: flex;
    }

    .mobile-nav a {
        display: block;
        padding: 15px 0;
        border-bottom: 1px solid var(--border-gold);
        color: var(--text-light);
        text-decoration: none;
        font-size: 16px;
        transition: var(--transition);
    }

    .mobile-nav a:hover {
        color: var(--gold-primary);
        padding-left: 10px;
    }

    .mobile-nav a:last-child {
        border-bottom: none;
    }

    /* Additional responsive fixes */
    @media (max-width: 480px) {
        .logo-icon {
            font-size: 24px;
        }
        
        .logo-text h1 {
            font-size: 12px;
        }
        
        .logo-text span {
            font-size: 8px;
        }
        
        .theme-toggle {
            width: 32px;
            height: 32px;
        }
        
        .mobile-menu-btn {
            font-size: 20px;
        }
    }

    /* Footer Styles */
    footer {
        background: var(--maroon-dark);
        padding: 50px 0 20px;
        margin-top: 50px;
    }

    .footer-content {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
    }

    .footer-section h3 {
        color: var(--gold-primary);
        margin-bottom: 20px;
    }

    .footer-section a {
        display: block;
        margin-bottom: 10px;
        color: var(--text-muted);
    }

    .footer-section a:hover {
        color: var(--gold-primary);
    }

    .copyright {
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: var(--border-gold);
        color: var(--text-muted);
    }

    /* Hero Section */
    .hero {
        position: relative;
        min-height: 88vh;
        display: flex;
        align-items: center;
        padding: 60px 25px;
        background: linear-gradient(180deg, rgba(18,9,4,0.88) 0%, rgba(38,19,9,0.94) 100%);
    }

    .hero-container {
        max-width: 1300px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        align-items: center;
        width: 100%;
    }

    .hero-content h3 {
        color: var(--gold-primary);
        font-size: 26px;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }

    .hero-content h1 {
        font-family: 'Cinzel', serif;
        font-size: 42px;
        color: var(--gold-primary);
        line-height: 1.25;
        margin-bottom: 12px;
    }

    .hero-desc {
        font-size: 16px;
        color: var(--text-muted);
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .hero-btns {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

    .btn-outline {
        background: transparent;
        border: 2px solid var(--gold-primary);
        color: var(--gold-primary);
        padding: 10px 24px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 600;
        transition: var(--transition);
    }

    .btn-outline:hover {
        background: rgba(244, 206, 106, 0.15);
        color: #fff;
        transform: translateY(-3px);
    }

    /* Services Grid */
    .services-grid {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
    }

    .service-card {
        background: var(--bg-glass);
        border: var(--border-gold);
        border-radius: 16px;
        padding: 35px 25px;
        text-align: center;
        transition: var(--transition);
    }

    .service-card:hover {
        transform: translateY(-10px);
        box-shadow: var(--shadow-gold);
    }

    .service-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px auto;
        background: var(--gold-gradient);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        color: #1a0c02;
    }

    .service-card h3 {
        font-family: 'Cinzel', serif;
        font-size: 20px;
        color: var(--gold-primary);
        margin-bottom: 12px;
    }

    .service-card p {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
    }

    /* Gallery */
    .gallery-grid {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .gallery-item {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        height: 250px;
        border: var(--border-gold);
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* Blog Cards */
    .blog-grid {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
    }

    .blog-card {
        background: var(--bg-card);
        border: var(--border-gold);
        border-radius: 15px;
        overflow: hidden;
        transition: var(--transition);
    }

    .blog-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-gold);
    }

    .blog-img {
        height: 200px;
        background: var(--bg-glass);
    }

    .blog-content {
        padding: 20px;
    }

    .blog-content h3 {
        color: var(--gold-primary);
        margin-bottom: 10px;
    }

    .blog-content p {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
    }

    /* Form Styles */
    .form-group {
        margin-bottom: 20px;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        background: var(--bg-card);
        border: var(--border-gold);
        border-radius: 8px;
        color: var(--text-light);
        font-size: 14px;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--gold-primary);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    /* Preloader Styles */
    #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #080301;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #particle-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    .loader-wrapper {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        margin: 0 auto;
    }

    .rotating-chakra {
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        border: 2px dashed var(--gold-primary);
        box-shadow: 0 0 35px var(--gold-primary), inset 0 0 20px var(--saffron);
        animation: rotateChakra 12s linear infinite;
    }

    .glowing-om {
        position: absolute;
        font-size: 90px;
        color: var(--gold-primary);
        text-shadow: 0 0 20px var(--gold-primary), 0 0 40px var(--saffron), 0 0 70px #cc5500;
        animation: pulseOm 2s ease-in-out infinite alternate;
        user-select: none;
        z-index: 20;
        line-height: 1;
    }

    .om-orbit {
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        animation: rotateChakra 7s linear infinite;
    }

    .orbit-node {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 32px;
        height: 32px;
        margin-top: -16px;
        margin-left: -16px;
    }

    .node-text {
        width: 100%;
        height: 100%;
        color: #fff;
        background: var(--maroon);
        border: 1.5px solid var(--gold-primary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        box-shadow: 0 0 8px var(--gold-primary);
        animation: keepUpright 7s linear infinite;
    }

    .loader-title {
        margin-top: 35px;
        font-family: 'Cinzel', serif;
        color: var(--gold-primary);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 3px;
        text-shadow: 0 0 15px rgba(244, 206, 106, 0.6);
        z-index: 10;
        text-align: center;
    }

    .loader-tagline {
        color: var(--text-muted);
        font-size: 14px;
        letter-spacing: 2px;
        margin-top: 6px;
        z-index: 10;
        text-align: center;
    }

    @keyframes rotateChakra {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes keepUpright {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
    }

    @keyframes pulseOm {
        0% { transform: scale(0.95); opacity: 0.85; }
        100% { transform: scale(1.06); opacity: 1; }
    }

    /* Modal Styles */
    .modal-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10000;
    }

    .modal-content {
        background: var(--bg-card);
        border: var(--border-gold);
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 90%;
        position: relative;
        max-height: 90vh;
        overflow-y: auto;
    }

    .close-modal {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 30px;
        color: var(--gold-primary);
        cursor: pointer;
        z-index: 10;
    }

    .form-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    /* Toast Notification */
    #toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--gold-gradient);
        color: var(--text-dark);
        padding: 15px 30px;
        border-radius: 50px;
        font-weight: 600;
        display: none;
        z-index: 10001;
        box-shadow: var(--shadow-gold);
    }

    /* Floating Action Buttons */
    .floating-action-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        z-index: 999;
    }

    .float-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: white;
        font-size: 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: var(--transition);
    }

    .float-appoint {
        background: var(--gold-gradient);
        color: var(--text-dark);
        font-size: 12px;
        font-weight: 600;
        padding: 0 15px;
        width: auto;
        border-radius: 30px;
    }

    .float-wa {
        background: #25D366;
    }

    .float-call {
        background: var(--saffron);
    }

    .float-btn:hover {
        transform: scale(1.1);
    }

    /* Tools Grid */
    .tools-grid {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
    }

    .tool-card {
        background: var(--bg-glass);
        border: var(--border-gold);
        border-radius: 12px;
        padding: 22px 15px;
        text-align: center;
        transition: var(--transition);
        cursor: pointer;
    }

    .tool-card:hover {
        background: rgba(244, 206, 106, 0.12);
        transform: scale(1.05);
        border-color: var(--gold-primary);
    }

    .tool-card i {
        font-size: 32px;
        color: var(--gold-primary);
        margin-bottom: 12px;
        display: block;
    }

    .tool-card h4 {
        font-size: 15px;
        color: var(--text-light);
    }

    /* Counters Grid */
    .counters-grid {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
        text-align: center;
    }

    .counter-card {
        background: var(--bg-glass);
        border: var(--border-gold);
        padding: 30px 15px;
        border-radius: 15px;
    }

    .counter-card h2 {
        font-family: 'Cinzel', serif;
        font-size: 42px;
        color: var(--gold-primary);
        margin-bottom: 8px;
    }

    .counter-card p {
        color: var(--text-light);
        font-size: 15px;
        font-weight: 500;
    }

    /* Testimonials */
    .testimonials-container {
        max-width: 800px;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
    }

    .testimonial-slide {
        display: none;
        background: var(--bg-glass);
        border: var(--border-gold);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
    }

    .testimonial-slide.active {
        display: block;
        animation: fadeIn 0.6s ease-in;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .stars {
        color: var(--gold-primary);
        font-size: 20px;
        margin-bottom: 15px;
    }

    .testimonial-text {
        font-style: italic;
        color: var(--text-muted);
        font-size: 16px;
        line-height: 1.7;
        margin-bottom: 20px;
    }

    .client-name {
        font-weight: 700;
        color: var(--gold-primary);
        font-size: 18px;
    }

    .client-location {
        font-size: 13px;
        color: var(--saffron);
    }

    /* Lightbox */
    #lightbox {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.92);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10000;
    }

    #lightbox img {
        max-width: 85%;
        max-height: 85%;
        border: 3px solid var(--gold-primary);
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
    }

    .close-lightbox {
        position: absolute;
        top: 25px;
        right: 35px;
        color: #fff;
        font-size: 35px;
        cursor: pointer;
    }

    /* Section Headers */
    .section-header {
        text-align: center;
        max-width: 700px;
        margin: 0 auto 50px auto;
    }

    .section-subtitle {
        color: var(--saffron);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 8px;
        display: block;
    }

    .section-title {
        font-family: 'Cinzel', serif;
        font-size: 34px;
        color: var(--gold-primary);
        line-height: 1.3;
    }

    .title-divider {
        width: 80px;
        height: 3px;
        background: var(--gold-gradient);
        margin: 15px auto 0 auto;
        border-radius: 2px;
        position: relative;
    }

    .title-divider::after {
        content: '🕉';
        position: absolute;
        top: -11px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg-dark);
        padding: 0 8px;
        color: var(--gold-primary);
        font-size: 13px;
    }

    /* Hero Specific */
    .hero-badges {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;

    .exp-ribbon {

        color: #1a0c02;
        padding: 10px 20px;

    /* Section Backgrounds */
    .why-us-bg {
        background: linear-gradient(180deg, rgba(38, 19, 9, 0.85), rgba(10, 4, 2, 0.96));
    }

    /* Responsive */
    @media (max-width: 1024px) {
        .nav-links {
            display: none;
        }
        
        .mobile-menu-btn {
            display: block;
        }
        
        .btn-gold {
            display: none;
        }
    }

    @media (max-width: 768px) {
        .nav-links {
            display: none;
        }
        
        .mobile-menu-btn {
            display: block;
        }
        
        .hero-container {
            grid-template-columns: 1fr;
        }
        
        .services-grid {
            grid-template-columns: 1fr;
        }
        
        .gallery-grid {
            grid-template-columns: 1fr;
        }
        
        .blog-grid {
            grid-template-columns: 1fr;
        }
        
        .tools-grid {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .counters-grid {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .form-grid-2 {
            grid-template-columns: 1fr;
        }
        
        .hero-badges {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .section-title h2 {
            font-size: 2rem;
        }
        
        .logo-text h1 {
            font-size: 14px;
        }
        
        .logo-text span {
            font-size: 9px;
        }
        
        .navbar {
            padding: 0 15px;
        }
    }
  </style>
</head>
<body>

{% include 'header.html' %}

<main>
    {% block content %}
    {% endblock %}
</main>

{% include 'footer.html' %}

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

<script>
    // Mobile Menu Toggle
    document.addEventListener('DOMContentLoaded', function() {
        const mobileMenuBtn = document.getElementById('mobileToggle');
        const mobileNav = document.getElementById('mobileNav');
        
        if (mobileMenuBtn && mobileNav) {
            mobileMenuBtn.addEventListener('click', function() {
                mobileNav.classList.toggle('active');
            });
        }
        
        // Close mobile menu when clicking on a link
        const mobileNavLinks = document.querySelectorAll('.mobile-nav a');
        mobileNavLinks.forEach(link => {
            link.addEventListener('click', function() {
                if (mobileNav) {
                    mobileNav.classList.remove('active');
                }
            });
        });
        
        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });
        
        // Add scroll effect to header
        const header = document.querySelector('header');
        if (header) {
            window.addEventListener('scroll', function() {
                if (window.scrollY > 50) {
                    header.style.background = 'rgba(38, 19, 9, 0.95)';
                    header.style.padding = '10px 0';
                } else {
                    header.style.background = 'rgba(38, 19, 9, 0.78)';
                    header.style.padding = '15px 0';
                }
            });
        }
        
        // Form validation
        const forms = document.querySelectorAll('form');
        forms.forEach(form => {
            form.addEventListener('submit', function(e) {
                const requiredFields = form.querySelectorAll('[required]');
                let isValid = true;
                
                requiredFields.forEach(field => {
                    if (!field.value.trim()) {
                        isValid = false;
                        field.style.borderColor = 'red';
                    } else {
                        field.style.borderColor = '';
                    }
                });
                
                if (!isValid) {
                    e.preventDefault();
                    alert('Please fill in all required fields');
                }
            });
        });
    });
</script>

</body>
</html>
