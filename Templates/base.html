{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaurishankar Jyotishkendra</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  
  <style>
    :root {
        --bg-dark: #120904;
        --bg-card: #221108;
        --bg-glass: rgba(38, 19, 9, 0.78);
        --gold-primary: #f4ce6a;
        --gold-secondary: #d4af37;
        --gold-gradient: linear-gradient(135deg, #ffe58f 0%, #d4af37 50%, #9a6818 100%);
        --saffron: #e67300;
        --maroon: #3b1906;
        --maroon-dark: #0a0402;
        --text-light: #fffdf5;
        --text-muted: #dcc4a6;
        --text-dark: #1a0c02;
        --shadow-gold: 0 0 25px rgba(212, 175, 55, 0.38);
        --border-gold: 1px solid rgba(212, 175, 55, 0.42);
        --transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Poppins', 'Mukta', sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-light);
        overflow-x: hidden;
        transition: background-color 0.4s ease, color 0.4s ease;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    a {
        text-decoration: none;
        color: inherit;
        transition: var(--transition);
    }

    .btn {
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: var(--transition);
    }

    .btn-primary {
        background: var(--gold-gradient);
        color: var(--text-dark);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-gold);
    }

    .section {
        padding: 80px 0;
    }

    .section-title {
        text-align: center;
        margin-bottom: 50px;
    }

    .section-title h2 {
        font-size: 2.5rem;
        color: var(--gold-primary);
        margin-bottom: 15px;
    }

    .card {
        background: var(--bg-card);
        border: var(--border-gold);
        border-radius: 15px;
        padding: 25px;
        transition: var(--transition);
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-gold);
    }

    /* Header Styles */
    header {
        background: var(--bg-glass);
        backdrop-filter: blur(10px);
        padding: 20px 0;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
    }

    .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--gold-primary);
    }

    .nav-links {
        display: flex;
        gap: 30px;
    }

    .nav-links a {
        color: var(--text-light);
        font-weight: 500;
    }

    .nav-links a:hover {
        color: var(--gold-primary);
    }

    /* Footer Styles */
    footer {
        background: var(--maroon-dark);
        padding: 50px 0 20px;
        margin-top: 50px;
    }

    .footer-content {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
    }

    .footer-section h3 {
        color: var(--gold-primary);
        margin-bottom: 20px;
    }

    .footer-section a {
        display: block;
        margin-bottom: 10px;
        color: var(--text-muted);
    }

    .footer-section a:hover {
        color: var(--gold-primary);
    }

    .copyright {
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: var(--border-gold);
        color: var(--text-muted);
    }

    /* Responsive */
    @media (max-width: 768px) {
        .nav-links {
            display: none;
        }
        
        .section-title h2 {
            font-size: 2rem;
        }
    }
  </style>
</head>
<body>

{% include 'header.html' %}

<main>
    {% block content %}
    {% endblock %}
</main>

{% include 'footer.html' %}

</body>
</html>
