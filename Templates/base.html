{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaurishankar Jyotishkendra</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <style>
    :root {
        --bg-dark: #120904;
        --bg-card: #221108;
        --bg-glass: rgba(38, 19, 9, 0.78);
        --gold-primary: #f4ce6a;
        --gold-secondary: #d4af37;
        --gold-gradient: linear-gradient(135deg, #ffe58f 0%, #d4af37 50%, #9a6818 100%);
        --saffron: #e67300;
        --maroon: #3b1906;
        --maroon-dark: #0a0402;
        --text-light: #fffdf5;
        --text-muted: #dcc4a6;
        --text-dark: #1a0c02;
        --shadow-gold: 0 0 25px rgba(212, 175, 55, 0.38);
        --border-gold: 1px solid rgba(212, 175, 55, 0.42);
        --transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Poppins', 'Mukta', sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-light);
        overflow-x: hidden;
        transition: background-color 0.4s ease, color 0.4s ease;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    a {
        text-decoration: none;
        color: inherit;
        transition: var(--transition);
    }

    .btn {
        padding: 12px 30px;
        border-radius: 50px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: var(--transition);
    }

    .btn-primary {
        background: var(--gold-gradient);
        color: var(--text-dark);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-gold);
    }

    .section {
        padding: 80px 0;
    }

    .section-title {
        text-align: center;
        margin-bottom: 50px;
    }

    .section-title h2 {
        font-size: 2.5rem;
        color: var(--gold-primary);
        margin-bottom: 15px;
    }

    .card {
        background: var(--bg-card);
        border: var(--border-gold);
        border-radius: 15px;
        padding: 25px;
        transition: var(--transition);
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-gold);
    }

    /* Header Styles */
    header {
        background: var(--bg-glass);
        backdrop-filter: blur(10px);
        padding: 20px 0;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
    }

    .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--gold-primary);
    }

    .nav-links {
        display: flex;
        gap: 30px;
    }

    .nav-links a {
        color: var(--text-light);
        font-weight: 500;
    }

    .nav-links a:hover {
        color: var(--gold-primary);
    }

    /* Mobile Menu */
    .mobile-menu-btn {
        display: none;
        background: none;
        border: none;
        color: var(--gold-primary);
        font-size: 1.5rem;
        cursor: pointer;
    }

    .mobile-nav {
        display: none;
        position: fixed;
        top: 70px;
        left: 0;
        width: 100%;
        background: var(--bg-card);
        padding: 20px;
        z-index: 999;
    }

    .mobile-nav.active {
        display: block;
    }

    .mobile-nav a {
        display: block;
        padding: 15px 0;
        border-bottom: 1px solid var(--border-gold);
    }

    /* Footer Styles */
    footer {
        background: var(--maroon-dark);
        padding: 50px 0 20px;
        margin-top: 50px;
    }

    .footer-content {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
    }

    .footer-section h3 {
        color: var(--gold-primary);
        margin-bottom: 20px;
    }

    .footer-section a {
        display: block;
        margin-bottom: 10px;
        color: var(--text-muted);
    }

    .footer-section a:hover {
        color: var(--gold-primary);
    }

    .copyright {
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: var(--border-gold);
        color: var(--text-muted);
    }

    /* Hero Section */
    .hero {
        position: relative;
        min-height: 88vh;
        display: flex;
        align-items: center;
        padding: 60px 25px;
        background: linear-gradient(180deg, rgba(18,9,4,0.88) 0%, rgba(38,19,9,0.94) 100%);
    }

    .hero-container {
        max-width: 1300px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        align-items: center;
        width: 100%;
    }

    .hero-content h3 {
        color: var(--gold-primary);
        font-size: 26px;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }

    .hero-content h1 {
        font-family: 'Cinzel', serif;
        font-size: 42px;
        color: var(--gold-primary);
        line-height: 1.25;
        margin-bottom: 12px;
    }

    .hero-desc {
        font-size: 16px;
        color: var(--text-muted);
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .hero-btns {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

    .btn-outline {
        background: transparent;
        border: 2px solid var(--gold-primary);
        color: var(--gold-primary);
        padding: 10px 24px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 600;
        transition: var(--transition);
    }

    .btn-outline:hover {
        background: rgba(244, 206, 106, 0.15);
        color: #fff;
        transform: translateY(-3px);
    }

    /* Services Grid */
    .services-grid {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
    }

    .service-card {
        background: var(--bg-glass);
        border: var(--border-gold);
        border-radius: 16px;
        padding: 35px 25px;
        text-align: center;
        transition: var(--transition);
    }

    .service-card:hover {
        transform: translateY(-10px);
        box-shadow: var(--shadow-gold);
    }

    .service-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px auto;
        background: var(--gold-gradient);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        color: #1a0c02;
    }

    .service-card h3 {
        font-family: 'Cinzel', serif;
        font-size: 20px;
        color: var(--gold-primary);
        margin-bottom: 12px;
    }

    .service-card p {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
    }

    /* Gallery */
    .gallery-grid {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .gallery-item {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        height: 250px;
        border: var(--border-gold);
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* Blog Cards */
    .blog-grid {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
    }

    .blog-card {
        background: var(--bg-card);
        border: var(--border-gold);
        border-radius: 15px;
        overflow: hidden;
        transition: var(--transition);
    }

    .blog-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-gold);
    }

    .blog-img {
        height: 200px;
        background: var(--bg-glass);
    }

    .blog-content {
        padding: 20px;
    }

    .blog-content h3 {
        color: var(--gold-primary);
        margin-bottom: 10px;
    }

    .blog-content p {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
    }

    /* Form Styles */
    .form-group {
        margin-bottom: 20px;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        background: var(--bg-card);
        border: var(--border-gold);
        border-radius: 8px;
        color: var(--text-light);
        font-size: 14px;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--gold-primary);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    /* Responsive */
    @media (max-width: 768px) {
        .nav-links {
            display: none;
        }
        
        .mobile-menu-btn {
            display: block;
        }
        
        .hero-container {
            grid-template-columns: 1fr;
        }
        
        .services-grid {
            grid-template-columns: 1fr;
        }
        
        .gallery-grid {
            grid-template-columns: 1fr;
        }
        
        .blog-grid {
            grid-template-columns: 1fr;
        }
        
        .section-title h2 {
            font-size: 2rem;
        }
    }
  </style>
</head>
<body>

{% include 'header.html' %}

<main>
    {% block content %}
    {% endblock %}
</main>

{% include 'footer.html' %}

<script>
    // Mobile Menu Toggle
    document.addEventListener('DOMContentLoaded', function() {
        const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
        const mobileNav = document.querySelector('.mobile-nav');
        
        if (mobileMenuBtn && mobileNav) {
            mobileMenuBtn.addEventListener('click', function() {
                mobileNav.classList.toggle('active');
            });
        }
        
        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });
        
        // Add scroll effect to header
        const header = document.querySelector('header');
        if (header) {
            window.addEventListener('scroll', function() {
                if (window.scrollY > 50) {
                    header.style.background = 'rgba(38, 19, 9, 0.95)';
                } else {
                    header.style.background = 'rgba(38, 19, 9, 0.78)';
                }
            });
        }
        
        // Form validation
        const forms = document.querySelectorAll('form');
        forms.forEach(form => {
            form.addEventListener('submit', function(e) {
                const requiredFields = form.querySelectorAll('[required]');
                let isValid = true;
                
                requiredFields.forEach(field => {
                    if (!field.value.trim()) {
                        isValid = false;
                        field.style.borderColor = 'red';
                    } else {
                        field.style.borderColor = '';
                    }
                });
                
                if (!isValid) {
                    e.preventDefault();
                    alert('Please fill in all required fields');
                }
            });
        });
    });
</script>

</body>
</html>
